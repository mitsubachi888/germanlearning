<!doctype html>
<html lang="uz" data-theme="lavender">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mẫu B · Bàn học</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.wrap { padding: 10px 22px 0; }
.date { font-size: 13px; font-weight: 700; color: var(--muted); }
.greet { font-family: var(--font-de); font-weight: 600; font-size: 40px; line-height: 1.05; margin: 6px 0 4px; letter-spacing: -.01em; }
.greet em { font-weight: 400; color: var(--muted); }
.gloss { color: var(--muted); font-size: 14px; font-weight: 600; margin-bottom: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 20px; }
.card h3 { margin: 0 0 14px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tl { list-style: none; margin: 0 0 18px; padding: 0; }
.tl li { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .m { font-size: 12px; font-weight: 800; color: var(--muted); }
.tl b { font-size: 15px; display: block; }
.tl small { color: var(--muted); font-weight: 600; font-size: 13px; }
.tl .e { width: 38px; height: 38px; border-radius: 12px; background: var(--air); display: grid; place-items: center; font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.stat { background: var(--soft); border-radius: 20px; padding: 14px 12px; }
.stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.stat span { font-size: 12px; font-weight: 700; color: var(--muted); }
.eta .bar { display: grid; grid-template-columns: 4fr 9fr 13fr 11fr; gap: 4px; margin: 12px 0 8px; }
.eta .bar i { height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; }
.eta .bar i:first-child::after { content: ""; position: absolute; inset: 0; width: 30%; background: var(--ink); }
.eta .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
.eta p { margin: 0; font-size: 15px; font-weight: 600; }
.eta p b { font-family: var(--font-de); font-size: 20px; }
.errs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
/* lesson */
.lhead { display: flex; justify-content: space-between; align-items: center; padding: 4px 22px 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.thin { margin: 0 22px; height: 4px; border-radius: 2px; background: var(--line); }
.thin i { display: block; height: 4px; width: 62%; border-radius: 2px; background: var(--ink); }
.phrase { margin: 22px 22px 0; background: var(--air); border-radius: 32px; padding: 26px 22px 22px; text-align: center; }
.phrase .pic { font-size: 44px; }
.phrase .big { font-family: var(--font-de); font-size: 46px; font-weight: 600; line-height: 1.05; margin: 8px 0 6px; }
.phrase .ipa { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.phrase .uz { font-size: 20px; font-weight: 700; margin-top: 14px; }
.phrase .en { font-size: 14px; color: var(--muted); font-weight: 600; }
.note { margin: 14px 22px 0; padding: 14px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
.note b.k { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.lvls { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin: 16px 22px 0; }
.lvls button { padding: 10px 4px; border-radius: 14px; border: 1.5px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
.lvls button.on { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.ctrls { display: flex; justify-content: center; gap: 18px; margin: 18px 22px 0; }
.ctrls button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.ctrls button span { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--surface); border: 1.5px solid var(--line); }
.ctrls button.rec span { width: 72px; height: 72px; background: var(--ink); color: var(--base); border: 0; font-size: 26px; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 22px 30px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; background: linear-gradient(transparent, var(--base) 30%); }
</style>
</head>
<body>
<main class="stage">
  <figure>
    <div class="phone">
      <div class="status"></div>
      <div class="scroll"><div class="wrap">
        <div class="date">Payshanba, 20-noyabr</div>
        <div class="greet">Guten Tag, <em>Aziz.</em></div>
        <div class="gloss">Xayrli kun! Bugun 30 daqiqa — 2-dars.</div>

        <section class="card">
          <h3>Bugungi reja</h3>
          <ol class="tl">
            <li><span class="m">0–5</span><div><b>Kartalarni takrorlash</b><small>12 ta karta</small></div><span class="e">🃏</span></li>
            <li><span class="m">5–17</span><div><b class="de">Das Alphabet</b><small>Video + 4 savol</small></div><span class="e">🎬</span></li>
            <li><span class="m">17–27</span><div><b>Gapirish mashqi</b><small>Tinglang va takrorlang</small></div><span class="e">🗣️</span></li>
            <li><span class="m">27–30</span><div><b>Qisqa yozish</b><small>Ismingizni harflab yozing</small></div><span class="e">✍️</span></li>
          </ol>
          <button class="btn">Darsni boshlash</button>
        </section>

        <div class="stats">
          <div class="stat"><b>48</b><span>soʻz</span></div>
          <div class="stat"><b>5 🔥</b><span>kun ketma-ket</span></div>
          <div class="stat"><b>3s 20d</b><span>jami vaqt</span></div>
        </div>

        <section class="card eta">
          <h3>A1 sari yoʻl</h3>
          <p>Taxminiy tugash: <b>2027-yil mart</b></p>
          <div class="bar"><i></i><i></i><i></i><i></i></div>
          <div class="row"><span>Bosqich 0</span><span>1</span><span>2</span><span>3</span></div>
        </section>

        <section class="card" style="margin-top:14px">
          <h3>Eng koʻp xatolar</h3>
          <div class="errs"><span class="chip">der / die / das · 6</span><span class="chip">ä ö ü ß · 3</span></div>
        </section>
      </div></div>
      <nav class="tabbar">
        <a class="on" href="#"><span class="ico">📖</span>Bugun</a>
        <a href="#"><span class="ico">🃏</span>Takrorlash</a>
        <a href="#"><span class="ico">🗺️</span>Yoʻl</a>
        <a href="#"><span class="ico">⚙️</span>Sozlamalar</a>
      </nav>
    </div>
    <figcaption class="caption">Màn hình chính · kế hoạch 30 phút + tiến độ</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"></div>
      <div class="scroll">
        <div class="lhead"><span>✕</span><span>Gapirish · 5 / 8</span><span>⚑</span></div>
        <div class="thin"><i></i></div>
        <div class="phrase">
          <div class="pic">🙂</div>
          <div class="big">Wie geht’s?</div>
          <div class="ipa">[viː ɡeːts]</div>
          <div class="uz">Ishlar qalay?</div>
          <div class="en">How are you? (informal)</div>
        </div>
        <div class="note">
          <b class="k">Pronunciation</b>
          German <b class="de">w</b> sounds like English <b>v</b> in <i>very</i>. <b class="de">ie</b> is a long <i>ee</i>, as in <i>see</i>.
        </div>
        <div class="lvls"><button class="on">1 · Tinglash</button><button>2 · Birga aytish</button><button>3 · Mustaqil</button></div>
        <div class="ctrls">
          <button><span>▶</span>Tinglash</button>
          <button class="rec"><span>🎙</span>Yozib olish</button>
          <button><span>🐢</span>Sekin</button>
        </div>
      </div>
      <div class="foot"><button class="btn ghost">Orqaga</button><button class="btn">Keyingisi</button></div>
    </div>
    <figcaption class="caption">Bài học · nghe-nhại (shadow 3 mức)</figcaption>
  </figure>
</main>
<script type="module" src="kit.js"></script>
</body>
</html>
